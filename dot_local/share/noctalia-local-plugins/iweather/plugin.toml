id = "ali/iweather"
name = "iWeather"
version = "1.0.0"
author = "Ali Abbas"
license = "MIT"
plugin_api = 24
icon = "cloud-sun"
description = "Current weather, hourly and five-day forecasts, inspired by alivault/iweather."
dependencies = ["python3", "xdg-open"]

[[widget]]
id = "weather"
entry = "bar.luau"
  [widget.actions]
  left = "panel-toggle ali/iweather:forecast"
  middle = "plugin ali/iweather:service all refresh"
  right = "plugin ali/iweather:service all units"

[[service]]
id = "service"
entry = "service.luau"

[[panel]]
id = "forecast"
entry = "panel.luau"
width = 440
height = 630
placement = "attached"
position = "auto"
open_near_click = true
keyboard_focus = "exclusive"
dismiss_on_outside_click = true
