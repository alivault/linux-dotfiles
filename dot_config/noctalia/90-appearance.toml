# Portable visual preferences captured from the GUI. No location/monitor state.
[bar.main]
background_opacity = 0.5
capsule = true
capsule_opacity = 0.0
capsule_padding = 8.0
capsule_thickness = 0.75
concave_edge_corners = false
end = ["tray", "notifications", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]
font_weight = 400
margin_edge = 0
margin_ends = 0
radius = 0
shadow = false
widget_spacing = 0
[widget.battery]
display_mode = "graphic"
scale = 0.7
show_label = false
[widget.brightness]
show_label = false
[widget.control-center]
glyph = "adjustments"
[widget.network]
show_label = false
[widget.volume]
show_label = false
[widget.workspaces]
active_pill_size = 1.0
