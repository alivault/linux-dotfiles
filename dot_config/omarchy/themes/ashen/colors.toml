mode = "dark"

# Ashen keeps Solitude's quiet monochrome palette, but reserves its
# brightest cool white for active/focused UI.
accent = "#f0f2f3"
# Match Ashen's Neovim Visual highlight (g_8).
selection = "#323232"
muted = "#4b4e55"

background = "#101315"
dark_background = "#0c0e10"
darker_background = "#080a0b"
lighter_background = "#101315"

foreground = "#a3a8ab"
dark_foreground = "#4b4e55"
light_foreground = "#d9dcde"
bright_foreground = "#f7f9fa"

hyprland_active_border = "rgba(f0f2f3ee) rgba(d9dcdeee)"
hyprland_inactive_border = "rgb(1e1e1e)"
active_border_color = "#f0f2f3"
active_tab_background = "#f0f2f3"

# Keep Lazygit's unselected file-status glyphs colored. Selected rows use the
# bright ANSI slot, so normal and bright red must both be chromatic.
red = "#de6145"
yellow = "#d9dbdc"
green = "#f0f2f3"
cyan = "#707070"
# Lazygit's default selected-line background is the normal ANSI blue slot.
blue = "#f0f2f3"
magenta = "#aeaeae"

bright_red = "#de6145"
bright_yellow = "#c9c2b4"
bright_green = "#ffffff"
bright_cyan = "#707070"
bright_blue = "#ffffff"
bright_magenta = "#9a9a9a"
