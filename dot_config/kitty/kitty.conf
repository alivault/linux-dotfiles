# ALNIAC theme colours (theme-sync writes them)
include ~/.local/state/alniac/current/theme/kitty.conf

# Font
font_family JetBrainsMono Nerd Font
bold_italic_font auto
font_size 12.0

# Window
window_padding_width 0
# Kitty reads ALNIAC's /etc/xdg/kitty/kitty.conf first, which hides decorations;
# "no" makes Kitty ask Niri for server-side decorations, so niri-tuned draws
# its title bar (coloured by the ALNIAC theme).
hide_window_decorations no
confirm_os_window_close 0

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Mod+A (select all) sends Ctrl+Shift+Alt+A: copy all the text, as Kitty cannot select all.
map ctrl+shift+alt+a launch --type=clipboard --stdin-source=@screen_scrollback

# Allow remote access
allow_remote_control yes

# Aesthetics
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
