# Niri launches recording commands; no privileged global input monitoring.
state_file = "auto"
[hotkey]
enabled = false
[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60
pause_media = true
[whisper]
model = "base.en"
language = "en"
translate = false
[output]
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 1
[output.notification]
on_recording_start = true
on_recording_stop = true
on_transcription = false
