<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local screen-sharing test</title>
<style>
  body { color-scheme: dark; background: #1a1b26; color: #c0caf5; font: 18px system-ui; max-width: 900px; margin: 40px auto; padding: 20px; }
  button { font: inherit; padding: 10px 16px; margin-right: 12px; }
  video { width: 100%; max-height: 65vh; background: #111; margin-top: 20px; }
</style>
<h1>Local screen-sharing test</h1>
<p>Choose another window or your screen, then move something in it. Check that
the preview updates. No audio, recording, uploads or external services are used.</p>
<button id="start">Choose screen/window</button>
<button id="stop" disabled>Stop sharing</button>
<p id="status" role="status">Ready. Capture begins only after you choose a source.</p>
<video id="preview" autoplay muted playsinline></video>
<script>
  const start = document.querySelector('#start');
  const stop = document.querySelector('#stop');
  const status = document.querySelector('#status');
  const preview = document.querySelector('#preview');
  let stream;
  function finish() {
    stream?.getTracks().forEach(track => track.stop());
    stream = undefined;
    preview.srcObject = null;
    start.disabled = false;
    stop.disabled = true;
    status.textContent = 'Sharing stopped.';
  }
  start.onclick = async () => {
    start.disabled = true;
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({video: true, audio: false});
      stream.getVideoTracks()[0].addEventListener('ended', finish, {once: true});
      preview.srcObject = stream;
      stop.disabled = false;
      await preview.play();
      status.textContent = 'Capture started. Confirm the picture moves, then stop sharing.';
    } catch (error) {
      finish();
      status.textContent = `${error.name}: ${error.message}`;
    }
  };
  stop.onclick = finish;
  window.addEventListener('pagehide', finish);
</script>
</html>
